[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sta-ingest"
version = "0.1.0"
description = "Ingestion pipeline for Swiss public transport punctuality data (opentransportdata.swiss)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "brotli>=1.1",  # the API answers with brotli; requests only decodes it when installed
    "gtfs-realtime-bindings>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sta-ingest = "sta_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
